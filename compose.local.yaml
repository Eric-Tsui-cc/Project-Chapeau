name: chapeau-local

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chapeau
      POSTGRES_PASSWORD: chapeau_local_only
      POSTGRES_DB: chapeau
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chapeau -d chapeau"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: chapeau-api:local
    env_file:
      - .env.local
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DatabaseProvider: Postgres
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=chapeau;Username=chapeau;Password=chapeau_local_only"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: chapeau-frontend:local
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - api

volumes:
  postgres-data: