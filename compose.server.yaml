name: chapeau

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chapeau
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Database password is required}"
      POSTGRES_DB: chapeau
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chapeau -d chapeau"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: chapeau-api:local
    pull_policy: never
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DatabaseProvider: Postgres
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=chapeau;Username=chapeau;Password=${POSTGRES_PASSWORD}"
      Gemini__ApiKey: "${GEMINI_API_KEY:?Gemini key is required}"
      Gemini__Model: gemini-3.5-flash-lite
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: chapeau-frontend:local
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - api

volumes:
  postgres-data: